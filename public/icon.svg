<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zone Watch">
  <rect width="512" height="512" rx="104" fill="#f2f6f8"/>
  <g transform="translate(38,38) scale(0.436)">

  
  <defs>
    <mask id="eyeWindow">
      <rect width="1000" height="1000" fill="#ffffff"/>
      <path d="M292 500 Q500 330 708 500 Q500 670 292 500 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- crosshair: horizontal bar behind the rings, vertical bar in front -->
  <g mask="url(#eyeWindow)">
    <rect x="44" y="482" width="912" height="36" fill="#4d9ba7"/>

    <g fill="none">
      <circle cx="500" cy="500" r="400" stroke="#1c3f5f" stroke-width="44"/>
      <circle cx="500" cy="500" r="322" stroke="#4d9ba7" stroke-width="38"/>
      <circle cx="500" cy="500" r="250" stroke="#1c3f5f" stroke-width="38"/>
      <circle cx="500" cy="500" r="196" stroke="#4d9ba7" stroke-width="32"/>
    </g>

    <rect x="482" y="62" width="36" height="838" fill="#1c3f5f"/>
  </g>

  <!-- the eye -->
  <path d="M292 500 Q500 330 708 500 Q500 670 292 500 Z"
        fill="none" stroke="#1c3f5f" stroke-width="42" stroke-linejoin="round"/>

  <!-- pupil, with the candle that started all this -->
  <circle cx="500" cy="500" r="96" fill="#ffffff" stroke="#1c3f5f" stroke-width="34"/>

  <g stroke-linecap="round">
    <!-- wicks -->
    <g stroke-width="9">
      <line x1="436" y1="462" x2="436" y2="530" stroke="#4d9ba7"/>
      <line x1="468" y1="438" x2="468" y2="514" stroke="#1c3f5f"/>
      <line x1="500" y1="452" x2="500" y2="560" stroke="#4d9ba7"/>
      <line x1="532" y1="428" x2="532" y2="502" stroke="#1c3f5f"/>
      <line x1="564" y1="456" x2="564" y2="524" stroke="#4d9ba7"/>
    </g>
    <!-- bodies -->
    <rect x="426" y="476" width="20" height="40" rx="3" fill="#4d9ba7"/>
    <rect x="458" y="452" width="20" height="48" rx="3" fill="#1c3f5f"/>
    <rect x="490" y="468" width="20" height="76" rx="3" fill="#ffffff" stroke="#4d9ba7" stroke-width="8"/>
    <rect x="522" y="444" width="20" height="44" rx="3" fill="#1c3f5f"/>
    <rect x="554" y="472" width="20" height="36" rx="3" fill="#4d9ba7"/>
  </g>

  </g>
</svg>
