# Run the app on any machine that has Docker, for hosts that do not stop idle
# containers. A host that sleeps idle containers (any free PaaS tier, or a trial
# that ran out) is fatal for something that has to watch prices around the clock.
# The documented free hosts (Serv00, then a VM) are in *Deploying for free* in
# README.md; Serv00 is shared hosting and has no Docker, so this file is for a VM,
# a laptop or any box you control.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# The volume keeps settings.json — and therefore the API keys, the broker
# credentials and the dashboard password — across rebuilds.
services:
  zone-watch:
    build:
      context: ..
    image: zone-watch:latest
    container_name: zone-watch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
    volumes:
      - zone-watch-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zone-watch-data:
